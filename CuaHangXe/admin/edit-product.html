<!doctype html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Chỉnh Sửa Sản Phẩm - LUXURY ADMIN</title>
		<link rel="stylesheet" href="../css/styles.css" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
	</head>
	<body>
		<div id="admin-header"></div>

		<main class="container" style="max-width: 820px">
			<h2 class="section-title">Chỉnh Sửa Thông Tin Sản Phẩm #3</h2>
			<div class="cart-box">
				<form onsubmit="return handleSaveEdit(event);" novalidate>
					<div class="form-group">
						<label for="edit-prod-name">Tên phương tiện:</label>
						<input
							type="text"
							id="edit-prod-name"
							class="form-input"
							value="Ford Ranger Wildtrak 2.0L" />
					</div>
					<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px">
						<div class="form-group">
							<label for="edit-prod-category">Phân loại hiện tại:</label>
							<select id="edit-prod-category" class="form-input"></select>
						</div>
						<div class="form-group">
							<label for="edit-prod-price">Giá bán (VNĐ):</label>
							<input
								type="text"
								id="edit-prod-price"
								class="form-input"
								value="973,000,000" />
						</div>
					</div>
					<div class="form-group">
						<label for="edit-prod-qty">Số lượng tồn kho:</label>
						<input
							type="number"
							id="edit-prod-qty"
							class="form-input"
							min="0"
							value="3" />
					</div>
					<div class="form-group">
						<label for="edit-prod-desc">Mô tả chi tiết:</label>
						<textarea id="edit-prod-desc" class="form-input" rows="3">Siêu bán tải hạng sang, động cơ Bi-Turbo 2.0L, hệ dẫn động 4x4.</textarea>
					</div>
					<div class="form-group">
						<label for="edit-prod-file"
							>Hình ảnh sản phẩm hiện tại (Chọn tệp mới nếu muốn thay đổi):</label
						>
						<input
							type="file"
							id="edit-prod-file"
							accept="image/*"
							class="form-input"
							onchange="previewEditImage(event)" />
						<div style="margin-top: 12px">
							<img
								id="edit-prod-preview"
								src="https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=800&q=80"
								alt="Ford Ranger Wildtrak 2.0L"
								style="
									max-height: 220px;
									border-radius: 10px;
									border: 1.5px solid #cbd5e1;
									object-fit: cover;
									display: block;
								" />
						</div>
					</div>

					<div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px">
						<a
							href="admin-products.html"
							class="btn-change-pass"
							style="text-decoration: none; display: inline-flex; align-items: center; gap: 7px">
							<i class="fa-solid fa-arrow-left"></i> Quay lại danh sách
						</a>
						<button type="submit" class="btn">
							<i class="fa-solid fa-floppy-disk"></i> Lưu Cập Nhật
						</button>
					</div>
				</form>
			</div>
		</main>

		<div id="admin-footer"></div>

		<script src="../js/common.js?v=22"></script>
		<script>
			function previewEditImage(e) {
				const file = e.target.files && e.target.files[0];
				if (!file) return;
				const reader = new FileReader();
				reader.onload = function (evt) {
					document.getElementById("edit-prod-preview").src = evt.target.result;
				};
				reader.readAsDataURL(file);
			}

			function handleSaveEdit(e) {
				if (e && e.preventDefault) e.preventDefault();
				showLuxuryBanner(
					"Cập Nhật Thành Công",
					"Thông tin phương tiện đã được cập nhật vào danh mục hệ thống.",
					{
						type: "success",
						btnText: "Về danh sách sản phẩm",
						onConfirm: function () { location.href = "admin-products.html"; },
					}
				);
				return false;
			}

			window.onload = function () {
				mountAdminChrome("products");
				const catSelect = document.getElementById("edit-prod-category");
				fillCategorySelect(catSelect, false);
				catSelect.value = "Pickup";
				setupNumberFormatter(document.getElementById("edit-prod-price"));
			};
		</script>
	</body>
</html>
