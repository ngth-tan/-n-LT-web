<!doctype html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Chỉnh Sửa Tài Khoản User - LUXURY ADMIN</title>
		<link rel="stylesheet" href="../css/styles.css" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
	</head>
	<body>
		<div id="admin-header"></div>

		<main class="container" style="max-width: 780px">
			<h2 class="section-title">Chỉnh Sửa Tài Khoản Khách Hàng #101</h2>

			<div class="cart-box">
				<form onsubmit="return handleSaveUser(event);" novalidate>
					<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px">
						<div class="form-group">
							<label for="edit-user-name">Họ và Tên:</label>
							<input type="text" id="edit-user-name" class="form-input" value="Nguyễn Văn A" />
						</div>
						<div class="form-group">
							<label for="edit-user-phone">Số điện thoại:</label>
							<input type="tel" id="edit-user-phone" class="form-input" value="0901234567" />
						</div>
					</div>
					<div class="form-group">
						<label for="edit-user-email">Email:</label>
						<input type="email" id="edit-user-email" class="form-input" value="anguyen@gmail.com" />
					</div>
					<div class="form-group">
						<label for="edit-user-address">Địa chỉ giao hàng mặc định:</label>
						<input
							type="text"
							id="edit-user-address"
							class="form-input"
							value="123 Lê Văn Sỹ, Phường 14, Quận 3, TP. Hồ Chí Minh" />
					</div>
					<div class="form-group">
						<label for="edit-user-status">Trạng thái tài khoản:</label>
						<select id="edit-user-status" class="form-input">
							<option value="active" selected>Hoạt động</option>
							<option value="locked">Đã khóa</option>
						</select>
					</div>

					<div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px">
						<a
							href="admin-users.html"
							class="btn-change-pass"
							style="text-decoration: none; display: inline-flex; align-items: center; gap: 7px">
							<i class="fa-solid fa-arrow-left"></i> Quay lại danh sách
						</a>
						<button type="submit" class="btn">
							<i class="fa-solid fa-floppy-disk"></i> Lưu Thay Đổi
						</button>
					</div>
				</form>
			</div>
		</main>

		<div id="admin-footer"></div>

		<script src="../js/common.js?v=22"></script>
		<script>
			function handleSaveUser(e) {
				if (e && e.preventDefault) e.preventDefault();
				showLuxuryBanner(
					"Cập Nhật Tài Khoản Thành Công",
					"Thông tin tài khoản khách hàng #101 đã được cập nhật.",
					{
						type: "success",
						btnText: "Về quản lý User",
						onConfirm: function () { location.href = "admin-users.html"; },
					}
				);
				return false;
			}
			window.onload = function () {
				mountAdminChrome("users");
			};
		</script>
	</body>
</html>
