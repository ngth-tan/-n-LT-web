<!doctype html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Quản Lý Sản Phẩm - LUXURY ADMIN</title>
		<link rel="stylesheet" href="../css/styles.css" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
		<style>
			.products-top-bar {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 16px;
				flex-wrap: wrap;
				margin-bottom: 22px;
			}
			.admin-btn-group {
				display: inline-flex;
				gap: 6px;
				flex-wrap: nowrap;
			}
		</style>
	</head>
	<body>
		<div id="admin-header"></div>

		<main class="container">
			<h2 class="section-title">Quản Lý Danh Mục Sản Phẩm</h2>

			<div class="cart-box">
				<div class="products-top-bar">
					<h3><i class="fa-solid fa-list-check"></i> Danh Sách Phương Tiện &amp; Phụ Kiện</h3>
					<a href="add-product.html" class="btn">
						<i class="fa-solid fa-circle-plus"></i> Thêm Sản Phẩm Mới
					</a>
				</div>

				<div class="admin-table-container">
					<table class="admin-table">
						<thead>
							<tr>
								<th>ID</th>
								<th>Hình</th>
								<th>Tên Xe</th>
								<th>Phân Loại</th>
								<th>Giá</th>
								<th>Số lượng</th>
								<th>Tình Trạng</th>
								<th>Thao Tác</th>
							</tr>
						</thead>
						<tbody id="admin-products-tbody"></tbody>
					</table>
				</div>
			</div>
		</main>

		<div id="admin-footer"></div>

		<script src="../js/common.js?v=22"></script>
		<script>
			function handleDeleteProduct(e, isSold, name) {
				if (e && e.preventDefault) e.preventDefault();
				if (isSold) {
					showLuxuryBanner(
						"Ẩn Sản Phẩm Đã Bán",
						'Sản phẩm "' + name + '" đã được bán ra nên hệ thống sẽ ẩn hiển thị trên trang khách hàng thay vì xóa vĩnh viễn.',
						{
							type: "info",
							btnText: "Đã hiểu",
							onConfirm: function () { location.reload(); },
						}
					);
				} else {
					showLuxuryBanner(
						"Xác Nhận Xóa Sản Phẩm",
						'Sản phẩm "' + name + '" chưa được bán ra. Bạn có chắc chắn muốn xóa sản phẩm này không?',
						{
							type: "warning",
							cancelText: "Hủy",
							btnText: "Xóa ngay",
							onConfirm: function () { location.reload(); },
						}
					);
				}
				return false;
			}

			function renderAdminProducts() {
				const products = read("db_products", []);
				const tbody = document.getElementById("admin-products-tbody");
				tbody.innerHTML = "";
				products.forEach(function (p) {
					const safeName = p.name.replace(/'/g, "\\'");
					tbody.innerHTML +=
						'<tr style="' + (p.hidden ? "opacity:0.55; background:#f1f5f9;" : "") + '">' +
						"<td>#" + p.id + "</td>" +
						'<td><img src="' + p.img + '" width="56" height="36" style="object-fit:cover; border-radius:6px;" /></td>' +
						"<td><strong>" + p.name + "</strong> " + (p.hidden ? '<span style="color:#dc2626; font-size:11.5px; font-weight:700;">(Đã ẩn)</span>' : "") + "</td>" +
						"<td>" + p.category + "</td>" +
						'<td style="color:#b48a18; font-weight:700;">' + formatVND(p.price) + "</td>" +
						"<td>" + (productQty(p) > 0 ? productQty(p) : "Đã hết hàng") + "</td>" +
						"<td>" + (p.isSold ? '<span style="color:#16a34a; font-weight:bold;">Đã bán</span>' : "Chưa bán") + "</td>" +
						'<td><div class="admin-btn-group">' +
						'<a href="edit-product.html" class="admin-action-btn admin-btn-edit">Sửa</a>' +
						'<button type="button" class="admin-action-btn admin-btn-danger" onclick="return handleDeleteProduct(event, ' + p.isSold + ", '" + safeName + '\')">Xóa</button>' +
						"</div></td></tr>";
				});
			}

			window.onload = function () {
				mountAdminChrome("products");
				renderAdminProducts();
			};
		</script>
	</body>
</html>
