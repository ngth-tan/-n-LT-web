<!doctype html>
<html lang="vi">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Khôi Phục Mật Khẩu - LUXURY AUTO</title>
	<link rel="stylesheet" href="../css/styles.css" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body style="background-color: var(--bg-light);">
	<header>
		<div class="logo"><a href="../index-guest.html">LUXURY <span>AUTO</span></a></div>
	</header>

	<main class="container" style="max-width: 450px; margin-top: 60px;">
		<div class="checkout-box">
			<h2 class="section-title" style="font-size: 22px; margin-bottom: 20px;">Khôi Phục Mật Khẩu</h2>
			<p style="font-size: 13px; color: #64748b; margin-bottom: 15px;">Nhập Gmail và mật khẩu mới để đặt lại.</p>
			<form onsubmit="handleForgot(event)" novalidate>
				<div class="form-group">
					<label>Tên đăng nhập / Gmail:</label>
					<input type="text" id="forgot-email" class="form-input" placeholder="Nhập Gmail..." />
				</div>
				<div class="form-group">
					<label>Mật khẩu mới:</label>
					<input type="password" id="forgot-password" class="form-input" placeholder="Nhập mật khẩu mới..." />
				</div>
				<p id="forgot-error" class="form-error"></p>
				<button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Đặt Lại Mật Khẩu</button>
			</form>
			<div style="text-align: center; margin-top: 15px;">
				<a href="login.html" style="color: var(--primary-color); font-size: 13px; font-weight: 600;">← Quay lại trang đăng nhập</a>
			</div>
		</div>
	</main>

	<script src="../js/common.js?v=15"></script>
	<script>
		function handleForgot(e) {
			e.preventDefault();
			showLuxuryBanner(
				"Đặt Lại Mật Khẩu Thành Công",
				"Mật khẩu mới đã được thiết lập. Mời quý khách đăng nhập lại hệ thống.",
				{
					type: "info",
					btnText: "Đăng nhập ngay",
					onConfirm: function () { location.href = "login.html"; },
				}
			);
		}
	</script>
</body>
</html>
