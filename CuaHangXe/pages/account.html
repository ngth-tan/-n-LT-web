<!doctype html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Tài khoản - LUXURY AUTO</title>
		<link rel="stylesheet" href="../css/styles.css" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
	</head>
	<body>
		<div id="site-header"></div>
		<main class="container" style="max-width: 900px">
			<h2 class="section-title">Thông Tin Tài Khoản</h2>

			<div class="account-card">
				<!-- Cột bên trái: Ảnh đại diện & Tên -->
				<div class="account-left">
					<div class="avatar-ring">
						<img
							src="https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=300&q=80"
							alt="Nguyễn Văn A" />
					</div>
					<h3 class="account-name">Nguyễn Văn A</h3>
					<p class="account-tier">Khách hàng thân thiết • #101</p>
					<p class="account-id">Mã KH: #101</p>
				</div>

				<!-- Đường kẻ dọc ngăn cách -->
				<div class="account-divider"></div>

				<!-- Cột bên phải: Thông tin chi tiết & Nút hành động -->
				<div class="account-right">
					<ul class="account-info-list">
						<li>
							<i class="fa-solid fa-user"></i>
							<span><strong>Họ và tên:</strong> Nguyễn Văn A</span>
						</li>
						<li>
							<i class="fa-solid fa-envelope"></i>
							<span><strong>Email:</strong> anguyen@gmail.com</span>
						</li>
						<li>
							<i class="fa-solid fa-phone"></i>
							<span><strong>Số điện thoại:</strong> 0901234567</span>
						</li>
						<li>
							<i class="fa-solid fa-location-dot"></i>
							<span
								><strong>Địa chỉ:</strong> 123 Lê Văn Sỹ, Phường 14, Quận 3, TP.
								Hồ Chí Minh</span
							>
						</li>
						<li>
							<i class="fa-solid fa-calendar-check"></i>
							<span>
								<strong>Trạng thái:</strong>
								<span class="account-status-badge">
									<span class="status-dot"></span> Hoạt động
								</span>
							</span>
						</li>
					</ul>

					<div class="account-actions">
						<a
							href="edit-account.html"
							class="btn-edit-profile"
							style="text-decoration: none">
							<i class="fa-solid fa-pen"></i> CHỈNH SỬA THÔNG TIN
						</a>
						<a
							href="change-password.html"
							class="btn-change-pass"
							style="text-decoration: none">
							Đổi mật khẩu
						</a>
					</div>
				</div>
			</div>
		</main>
		<div id="site-footer"></div>
		<script src="../js/common.js?v=14"></script>
		<script>
			window.onload = function () {
				mountChrome();
			};
		</script>
	</body>
</html>
