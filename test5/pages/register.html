<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Ký - LUXURY AUTO</title>
    <link rel="stylesheet" href="../css/styles.css" />
</head>
<body style="background-color: var(--bg-light);">
    <header>
        <div class="logo"><a href="../index.html">LUXURY <span>AUTO</span></a></div>
    </header>

    <main class="container" style="max-width: 450px; margin-top: 60px;">
        <div class="checkout-box">
            <h2 class="section-title" style="font-size: 22px; margin-bottom: 20px;">Đăng Ký Tài Khoản</h2>
            <form onsubmit="handleRegister(event)" novalidate>
                <div class="form-group">
                    <label>Họ và tên:</label>
                    <input type="text" id="reg-name" class="form-input" placeholder="Nguyễn Văn A" />
                </div>
                <div class="form-group">
                    <label>Tên đăng nhập / Gmail:</label>
                    <input type="text" id="reg-email" class="form-input" placeholder="Nhập tên đăng nhập / Gmail..." />
                </div>
                <div class="form-group">
                    <label>Mật khẩu mới:</label>
                    <input type="password" id="reg-password" class="form-input" placeholder="Tạo mật khẩu..." />
                </div>
                <div class="form-group">
                    <label>Xác nhận mật khẩu:</label>
                    <input type="password" id="reg-confirm" class="form-input" placeholder="Nhập lại mật khẩu..." />
                </div>
                <p id="reg-error" class="form-error"></p>
                <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Hoàn Tất Đăng Ký</button>
            </form>
            <div style="text-align: center; margin-top: 15px;">
                <a href="login.html" style="color: var(--primary-color); font-size: 13px; font-weight: 600;">← Quay lại trang đăng nhập</a>
            </div>
        </div>
    </main>

    <script src="../js/common.js"></script>
    <script>
        function handleRegister(e) {
            e.preventDefault();
            const err = Auth.register($("reg-name").value, $("reg-email").value, $("reg-password").value, $("reg-confirm").value);
            $("reg-error").textContent = err;
            if (!err) {
                alert("Đăng ký tài khoản thành công! Mời bạn đăng nhập.");
                location.href = "login.html";
            }
        }
    </script>
</body>
</html>
