<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kawasaki KLX 150 BF - LUXURY AUTO</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
    <div id="site-header"></div>
    <main class="container">
        <h2 class="section-title">Chi Tiết Sản Phẩm</h2>
        <div class="checkout-wrapper" style="align-items: center; background: white; padding: 30px; border-radius: 12px;">
            <div>
                <img src="https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=800&q=80" alt="Kawasaki KLX 150 BF" style="width: 100%; border-radius: 8px; object-fit: cover; height: 350px;" />
            </div>
            <div>
                <h2 style="color: var(--primary-color); margin-bottom: 10px; font-size: 28px;">Kawasaki KLX 150 BF</h2>
                <div style="color: #64748b; font-weight: 600; margin-bottom: 10px; font-size: 15px;">Phân loại: Moto</div>
                <div style="font-size: 26px; color: var(--accent-color); font-weight: bold; margin-bottom: 15px;">79.000.000 đ</div>
                <p style="color: #475569; margin-bottom: 15px; line-height: 1.8;">Mô tô cào cào địa hình chuyên dụng, động cơ 150cc mạnh mẽ.</p>
                <div style="font-size: 13px; color: #64748b; margin-bottom: 20px;">Mã sản phẩm: #1 • Tình trạng: Còn hàng</div>
                <button class="btn" style="width: 100%; padding: 14px;" onclick="addToCart(1)"><i class="fa-solid fa-cart-plus"></i> Thêm Vào Giỏ Hàng Ngay</button>
                <a href="products.html" class="btn btn-muted"><i class="fa-solid fa-arrow-left"></i> Quay lại Danh Sách</a>
            </div>
        </div>
        <h3 style="margin: 40px 0 20px; color: var(--primary-color);">Sản phẩm cùng phân loại</h3>
        <div class="car-grid" id="detail-related"></div>
    </main>
    <div id="site-footer"></div>
    <script src="../js/common.js?v=10"></script>
    <script>
        window.onload = function () {
            mountChrome();
            const related = visibleProducts().filter(function (x) { return x.category === "Moto" && x.id !== 1; }).slice(0, 3);
            const relEl = document.getElementById("detail-related");
            relEl.innerHTML = related.length ? "" : '<p style="color:#64748b;">Chưa có sản phẩm cùng phân loại.</p>';
            related.forEach(function (r) {
                relEl.innerHTML +=
                    '<div class="car-card"><a href="product.html"><img src="' + r.img + '" alt="' + r.name + '" class="car-img" /></a>' +
                    '<div class="car-info"><h3 class="car-title"><a href="product.html">' + r.name + '</a></h3>' +
                    '<div class="car-price">' + formatVND(r.price) + '</div>' +
                    '<div class="car-qty">' + productQtyLabel(r) + '</div>' +
                    '<div class="card-actions"><a class="card-btn" href="product.html">Chi Tiết</a></div></div></div>';
            });
        };
    </script>
</body>
</html>
