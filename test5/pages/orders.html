<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lịch sử mua hàng - LUXURY AUTO</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
    <div id="site-header"></div>
    <main class="container">
        <h2 class="section-title">Lịch Sử Giao Dịch Mua Hàng</h2>
        <div class="admin-table-container">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Mã Đơn</th>
                        <th>Ngày Đặt</th>
                        <th>Sản Phẩm</th>
                        <th>Địa Điểm Giao</th>
                        <th>Thanh Toán</th>
                        <th>Tổng Tiền</th>
                        <th>Trạng Thái</th>
                    </tr>
                </thead>
                <tbody id="user-orders-tbody"></tbody>
            </table>
        </div>
    </main>
    <div id="site-footer"></div>
    <script src="../js/common.js?v=10"></script>
    <script>
        window.onload = function () {
            mountChrome();
            const u = Auth.user();
            const orders = (read("db_orders", []) || []).filter(function (o) {
                return u && (o.customerId === u.id || o.customerEmail === u.email);
            });
            const tbody = document.getElementById("user-orders-tbody");
            if (!orders.length) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Chưa có đơn hàng.</td></tr>';
                return;
            }
            orders.forEach(function (o) {
                const itemsHtml = (o.items || []).map(function (i) {
                    return i.name + " x" + (i.qty || 1);
                }).join("<br/>");
                tbody.innerHTML +=
                    "<tr>" +
                    '<td><a href="invoice.html?invoice=' + encodeURIComponent(o.id) + '"><strong>' + o.id + "</strong></a></td>" +
                    "<td>" + o.date + "</td>" +
                    "<td>" + itemsHtml + "</td>" +
                    "<td>" + o.address + "</td>" +
                    "<td>" + o.paymentMethod + "</td>" +
                    '<td style="color:var(--accent-color); font-weight:bold;">' + formatVND(o.total) + "</td>" +
                    '<td><span class="status-badge confirmed">' + o.status + "</span></td>" +
                    "</tr>";
            });
        };
    </script>
</body>
</html>
