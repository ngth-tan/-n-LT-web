<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sản phẩm - LUXURY AUTO</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
    <div id="site-header"></div>
    <main class="container">
        <h2 class="section-title">Danh Mục Sản Phẩm & Tìm Kiếm Nâng Cao</h2>
        <div class="search-filter-bar">
            <div class="filter-group">
                <input type="text" id="search-name" placeholder="Tìm kiếm theo tên phương tiện..." class="search-input" oninput="currentPage=1; renderProducts();" />
            </div>
            <div class="filter-group">
                <select id="filter-category" class="search-select" onchange="currentPage=1; renderProducts();"></select>
            </div>
            <div class="filter-group">
                <select id="filter-price" class="search-select" onchange="currentPage=1; renderProducts();"></select>
            </div>
        </div>
        <div class="car-grid" id="product-grid"></div>
        <div class="pagination" id="pagination-controls"></div>
    </main>
    <div id="site-footer"></div>
    <script src="../js/common.js?v=13"></script>
    <script>
        let currentPage = 1;
        const itemsPerPage = 3;

        function renderProducts() {
            const filtered = visibleProducts();
            const grid = document.getElementById("product-grid");
            const paginationEl = document.getElementById("pagination-controls");
            grid.innerHTML = "";
            paginationEl.innerHTML = "";

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; padding: 20px; color:#64748b;">Không tìm thấy phương tiện hoặc phụ kiện phù hợp.</p>';
                return;
            }

            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            currentPage = 1;
            const pageProducts = filtered.slice(0, itemsPerPage);

            pageProducts.forEach(function (p) {
                const sold = p.isSold ? '<span class="sold-badge">Đã bán</span>' : "";
                const buyBtn = p.isSold
                    ? '<button class="card-btn" disabled>Đã bán</button>'
                    : '<button class="card-btn card-btn-buy" onclick="addToCart(' + p.id + ')"><i class="fa-solid fa-cart-shopping"></i> Mua</button>';
                grid.innerHTML +=
                    '<div class="car-card">' +
                    '<a href="' + detailHref(p.id) + '"><img src="' + p.img + '" alt="' + p.name + '" class="car-img" /></a>' +
                    '<div class="car-info">' +
                    '<h3 class="car-title"><a href="' + detailHref(p.id) + '">' + p.name + "</a> " + sold + "</h3>" +
                    '<div class="car-category">' + p.category + "</div>" +
                    '<div class="car-price">' + formatVND(p.price) + "</div>" +
                    '<div class="car-qty">' + productQtyLabel(p) + "</div>" +
                    '<p style="font-size:13px; color:#64748b; margin-bottom:15px;">' + p.desc + "</p>" +
                    '<div class="card-actions">' +
                    '<a class="card-btn" href="' + detailHref(p.id) + '"><i class="fa-solid fa-eye"></i> Chi Tiết</a>' +
                    buyBtn +
                    "</div></div></div>";
            });

            if (totalPages > 1) {
                let pagHTML = '<button class="page-btn" onclick="changePage(' + (currentPage - 1) + ')">&laquo;</button>';
                for (let i = 1; i <= totalPages; i++) {
                    pagHTML += '<button class="page-btn ' + (i === currentPage ? "active" : "") + '" onclick="changePage(' + i + ')">' + i + "</button>";
                }
                pagHTML += '<button class="page-btn" onclick="changePage(' + (currentPage + 1) + ')">&raquo;</button>';
                paginationEl.innerHTML = pagHTML;
            }
        }

        function changePage() {
            const onProducts = /\/products\.html$/i.test(String(location.pathname || "").replace(/\\/g, "/"));
            if (onProducts) location.reload();
            else location.href = "products.html";
            return false;
        }

        window.onload = function () {
            mountChrome();
            fillCategorySelect(document.getElementById("filter-category"), true);
            fillPriceSelect(document.getElementById("filter-price"));
            renderProducts();
        };
    </script>
</body>
</html>
