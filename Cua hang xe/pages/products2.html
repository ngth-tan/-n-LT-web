<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sản phẩm - LUXURY AUTO</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0d1a33;
      --navy-2: #121f3b;
      --gold: #c9a227;
      --gold-light: #e0b83a;
      --text: #1a1a1a;
      --bg: #f4f7fb;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: var(--text); }
    a { text-decoration: none; color: inherit; }

    /* ===== HEADER ===== */
    header { background: var(--navy); box-shadow: 0 4px 12px rgba(0,0,0,.3); position: sticky; top: 0; z-index: 100; }
    .nav { max-width: 1400px; margin: 0 auto; padding: 0 26px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 10px; color: #fff; font-size: 22px; font-weight: 800; letter-spacing: 1px; }
    .logo span { color: var(--gold); }
    .menu { display: flex; align-items: center; gap: 34px; list-style: none; height: 100%; }
    .menu > li { height: 100%; display: flex; align-items: center; }
    .menu > li > a { color: #fff; font-size: 12px; font-weight: 600; text-transform: uppercase; display: flex; align-items: center; gap: 6px; height: 100%; position: relative; transition: color .2s; }
    .menu > li > a:hover, .menu > li > a.active { color: var(--gold-light); }
    .menu > li > a.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--gold); }

    /* user dropdown */
    .user { position: relative; }
    .user-btn { background: none; border: none; color: #fff; font-family: inherit; font-size: 15px; font-weight: 700; text-transform: uppercase; display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .user-btn img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; background: #cfd6e4; }
    .user-btn i { font-size: 11px; transition: transform .2s; }
    .user.open .user-btn i { transform: rotate(180deg); }
    .dropdown { position: absolute; right: 0; top: calc(100% + 8px); width: 235px; background: var(--navy); border-radius: 10px; padding: 10px 0; box-shadow: 0 10px 28px rgba(0,0,0,.35); display: none; }
    .user.open .dropdown { display: block; }
    .dropdown a { display: flex; align-items: center; gap: 12px; padding: 10px 20px; color: #fff; font-size: 14px; font-weight: 500; transition: background .2s; }
    .dropdown a i { color: var(--gold); width: 18px; text-align: center; }
    .dropdown a:hover { background: rgba(255,255,255,.08); }
    .dropdown hr { border: none; border-top: 1px solid rgba(255,255,255,.15); margin: 8px 20px; }

    /* ===== LAYOUT ===== */
    main { max-width: 1400px; margin: 0 auto; padding: 24px 26px 50px; }
    .page-title { text-align: center; font-size: 26px; font-weight: 800; text-transform: uppercase; }
    .page-title::after { content: ""; display: block; width: 90px; height: 3px; background: var(--gold); margin: 14px auto 28px; border-radius: 2px; }
    .layout { display: grid; grid-template-columns: 245px 1fr; gap: 20px; align-items: start; }

    /* ===== SIDEBAR ===== */
    .sidebar { background: var(--navy); border-radius: 14px; padding: 22px 18px; box-shadow: 0 6px 18px rgba(0,0,0,.2); }
    .sidebar h3 { color: var(--gold); font-size: 15px; font-weight: 700; text-transform: uppercase; display: flex; gap: 10px; align-items: center; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,.12); margin-bottom: 10px; }
    .sidebar ul { list-style: none; }
    .sidebar li { color: #fff; font-size: 14px; font-weight: 500; padding: 10px 12px; border-radius: 20px; cursor: pointer; transition: all .2s; margin-bottom: 2px; }
    .sidebar li:hover { background: rgba(255,255,255,.08); }
    .sidebar li.active { background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: #1a1a1a; font-weight: 700; }

    /* ===== FILTER BAR ===== */
    .filter { background: #fff; border-radius: 14px; padding: 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.06); flex-wrap: wrap; }
    .search-btn { width: 32px; height: 40px; width: 32px; background: var(--gold); border: none; border-radius: 8px; color: #1a1a1a; cursor: pointer; width: 32px; }
    .filter input { flex: 1; min-width: 160px; height: 40px; border: 1px solid #d5dae3; border-radius: 8px; padding: 0 12px; font-family: inherit; font-size: 13px; outline: none; }
    .filter input:focus, .filter select:focus { border-color: var(--gold); }
    .filter select { height: 40px; border: 1px solid #d5dae3; border-radius: 8px; padding: 0 10px; font-family: inherit; font-size: 13px; background: #fff; cursor: pointer; outline: none; }
    .btn-filter { height: 40px; padding: 0 24px; border: none; border-radius: 8px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer; }
    .clear { background: none; border: none; font-family: inherit; font-size: 13px; cursor: pointer; color: var(--text); }
    .clear:hover { color: var(--gold); }
    .result-bar { display: flex; justify-content: space-between; font-size: 12px; margin: 8px 0 12px; }

    /* ===== GRID ===== */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
    .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,.08); transition: transform .25s, box-shadow .25s; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(0,0,0,.14); }
    .card img { width: 100%; height: 152px; object-fit: cover; display: block; background: #dfe5ef; }
    .card-body { padding: 18px 16px 16px; }
    .card h4 { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
    .meta { font-size: 12px; margin-bottom: 10px; text-transform: none; }
    .meta b { font-weight: 500; text-transform: uppercase; }
    .price-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .price { color: var(--gold); font-size: 17px; font-weight: 800; }
    .stock { background: #c9f3d4; color: #14532d; font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 6px; display: inline-flex; align-items: center; gap: 5px; }
    .stock::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #16a34a; }
    .stock.out { background: #fde2e2; color: #7f1d1d; }
    .stock.out::before { background: #dc2626; }
    .btns { display: flex; gap: 10px; }
    .btns button { flex: 1; height: 38px; border-radius: 20px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s; display: inline-flex; justify-content: center; align-items: center; gap: 6px; }
    .btn-detail { background: #fff; border: 1.5px solid #1a1a1a; }
    .btn-detail:hover { background: #1a1a1a; color: #fff; }
    .btn-cart { background: linear-gradient(135deg, var(--gold), var(--gold-light)); border: none; color: #fff; }
    .btn-cart:hover { filter: brightness(1.08); }
    .btn-cart:disabled { background: #bbb; cursor: not-allowed; }
    .empty { grid-column: 1 / -1; text-align: center; padding: 60px 0; color: #666; }

    /* ===== PAGINATION ===== */
    .pagination { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 28px; }
    .pagination button { width: 36px; height: 36px; border: none; background: none; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 6px; }
    .pagination button.active { background: var(--navy); color: #fff; }
    .pagination button:hover:not(.active):not(:disabled) { background: #e3e8f1; }
    .pagination button:disabled { color: #aaa; cursor: not-allowed; }

    /* toast */
    .toast { position: fixed; right: 24px; bottom: 24px; background: var(--navy); color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 13px; box-shadow: 0 8px 20px rgba(0,0,0,.3); opacity: 0; transform: translateY(20px); transition: all .3s; pointer-events: none; z-index: 200; }
    .toast.show { opacity: 1; transform: none; }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .menu { gap: 16px; }
      .user-btn span { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <nav class="nav">
      <a href="../index.html" class="logo"><i class="fa-solid fa-car"></i> LUXURY <span>AUTO</span></a>
      <ul class="menu">
        <li><a href="../index.html"><i class="fa-solid fa-house"></i> Trang chủ</a></li>
        <li><a href="products.html" class="active"><i class="fa-solid fa-box-archive"></i> Sản phẩm</a></li>
        <li><a href="cart.html"><i class="fa-solid fa-cart-shopping"></i> Giỏ hàng (<span id="cartCount">0</span>)</a></li>
        <li class="user" id="user">
          <button class="user-btn" id="userBtn">
            <img src="../images/avatar.jpg" alt="avatar" onerror="this.src='https://ui-avatars.com/api/?name=Nguyen+Van+A&background=c9a227&color=fff'">
            <span>Nguyễn Văn A</span>
            <i class="fa-solid fa-caret-down"></i>
          </button>
          <div class="dropdown">
            <a href="account.html"><i class="fa-solid fa-user"></i> Thông tin tài khoản</a>
            <a href="history.html"><i class="fa-solid fa-calendar-days"></i> Lịch sử mua hàng</a>
            <a href="change-password.html"><i class="fa-solid fa-lock"></i> Đổi mật khẩu</a>
            <hr>
            <a href="login.html"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</a>
          </div>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <h1 class="page-title">Danh mục sản phẩm &amp; Tìm kiếm nâng cao</h1>

    <div class="layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <h3><i class="fa-solid fa-list-ul"></i> Phân loại xe</h3>
        <ul id="categories"></ul>
      </aside>

      <!-- Content -->
      <section>
        <div class="filter">
          <button class="search-btn" id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
          <input type="text" id="keyword" placeholder="Tìm kiếm theo tên phương tiện...">
          <select id="brand"></select>
          <select id="price">
            <option value="all">Mức giá: Tất cả</option>
            <option value="0-50000000">Dưới 50 Triệu</option>
            <option value="50000000-1000000000">50 Triệu - 1 Tỷ VND</option>
            <option value="1000000000-999999999999">Trên 1 Tỷ VND</option>
          </select>
          <select id="sort">
            <option value="new">Sắp xếp: Mới nhất</option>
            <option value="asc">Giá tăng dần</option>
            <option value="desc">Giá giảm dần</option>
            <option value="name">Tên A - Z</option>
          </select>
          <button class="btn-filter" id="applyBtn">Lọc</button>
          <button class="clear" id="clearBtn1">Xóa bộ lọc</button>
        </div>

        <div class="result-bar">
          <span id="resultText"></span>
          <button class="clear" id="clearBtn2">Xóa bộ lọc</button>
        </div>

        <div class="grid" id="grid"></div>
        <div class="pagination" id="pagination"></div>
      </section>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    /* ===== DỮ LIỆU MẪU (24 sản phẩm) ===== */
    const PRODUCTS = [
      { id: 1,  name: "Kawasaki KLX 150 BF",     cat: "Moto",        brand: "Kawasaki", meta: "MOTO • 150cc • 5 cấp số • Xăng",           price: 79000000,   stock: 4, img: "../images/kawasaki-klx.jpg" },
      { id: 2,  name: "VinFast Evo Grand Premia", cat: "Xe máy điện", brand: "VinFast",  meta: "XE MÁY ĐIỆN • Động cơ điện • 50km/h • Pin LFP", price: 27900000, stock: 8, img: "../images/vinfast-evo.jpg" },
      { id: 3,  name: "Ford Ranger Wildtrak 2.0L",cat: "Pickup",      brand: "Ford",     meta: "PICKUP • 2.0L Bi-Turbo • Dầu • 2 cầu (4x4)", price: 973000000,  stock: 3, img: "../images/ford-ranger.jpg" },
      { id: 4,  name: "Honda CB150R Streetster",  cat: "Moto",        brand: "Honda",    meta: "MOTO • 150cc • 6 cấp số • Xăng",           price: 105000000,  stock: 5, img: "../images/honda-cb150r.jpg" },
      { id: 5,  name: "Yamaha MT-15",             cat: "Moto",        brand: "Yamaha",   meta: "MOTO • 155cc • 6 cấp số • Xăng",           price: 69000000,   stock: 6, img: "../images/yamaha-mt15.jpg" },
      { id: 6,  name: "Ducati Monster 937",       cat: "Moto",        brand: "Ducati",   meta: "MOTO • 937cc • 6 cấp số • Xăng",           price: 489000000,  stock: 2, img: "../images/ducati-monster.jpg" },
      { id: 7,  name: "VinFast Klara S",          cat: "Xe máy điện", brand: "VinFast",  meta: "XE MÁY ĐIỆN • 1.800W • 80km/h • Pin LFP",  price: 39900000,   stock: 10, img: "../images/vinfast-klara.jpg" },
      { id: 8,  name: "Yadea Ulike",              cat: "Xe máy điện", brand: "Yadea",    meta: "XE MÁY ĐIỆN • 1.200W • 45km/h • Pin Lithium", price: 22500000, stock: 7, img: "../images/yadea-ulike.jpg" },
      { id: 9,  name: "Dat Bike Weaver 200",      cat: "Xe máy điện", brand: "Dat Bike", meta: "XE MÁY ĐIỆN • 6kW • 90km/h • Pin Lithium", price: 66900000,   stock: 3, img: "../images/datbike-weaver.jpg" },
      { id: 10, name: "Toyota Hilux 2.4L",        cat: "Pickup",      brand: "Toyota",   meta: "PICKUP • 2.4L Diesel • 6AT • 4x2",          price: 674000000,  stock: 4, img: "../images/toyota-hilux.jpg" },
      { id: 11, name: "Mitsubishi Triton 4x4",    cat: "Pickup",      brand: "Mitsubishi", meta: "PICKUP • 2.4L Diesel • 6AT • 4x4",        price: 782000000,  stock: 0, img: "../images/mitsubishi-triton.jpg" },
      { id: 12, name: "Isuzu D-Max 1.9L",         cat: "Pickup",      brand: "Isuzu",    meta: "PICKUP • 1.9L Diesel • 6AT • 4x2",          price: 650000000,  stock: 5, img: "../images/isuzu-dmax.jpg" },
      { id: 13, name: "Ford Everest Titanium",    cat: "SUV",         brand: "Ford",     meta: "SUV • 2.0L Bi-Turbo • 10AT • 7 chỗ",        price: 1299000000, stock: 2, img: "../images/ford-everest.jpg" },
      { id: 14, name: "Toyota Fortuner Legender", cat: "SUV",         brand: "Toyota",   meta: "SUV • 2.8L Diesel • 6AT • 7 chỗ",           price: 1350000000, stock: 3, img: "../images/toyota-fortuner.jpg" },
      { id: 15, name: "Hyundai Santa Fe Calligraphy", cat: "SUV",     brand: "Hyundai",  meta: "SUV • 2.5L Xăng • 8DCT • 7 chỗ",            price: 1380000000, stock: 4, img: "../images/hyundai-santafe.jpg" },
      { id: 16, name: "Mũ bảo hiểm Fullface AGV", cat: "Phụ kiện",    brand: "AGV",      meta: "PHỤ KIỆN • Fullface • Size M/L/XL",         price: 3500000,    stock: 25, img: "../images/helmet.jpg" },
      { id: 17, name: "Găng tay da Alpinestars",  cat: "Phụ kiện",    brand: "Alpinestars", meta: "PHỤ KIỆN • Da thật • Chống trượt",       price: 1800000,    stock: 18, img: "../images/gloves.jpg" },
      { id: 18, name: "Camera hành trình 4K",     cat: "Phụ kiện",    brand: "Vietmap",  meta: "PHỤ KIỆN • 4K • Wi-Fi • Ghi đêm",           price: 2900000,    stock: 14, img: "../images/dashcam.jpg" },
      { id: 19, name: "Mazda MX-5 RF",            cat: "Roadster",    brand: "Mazda",    meta: "ROADSTER • 2.0L • 6MT • 2 chỗ",             price: 1550000000, stock: 1, img: "../images/mazda-mx5.jpg" },
      { id: 20, name: "Porsche 718 Boxster",      cat: "Roadster",    brand: "Porsche",  meta: "ROADSTER • 2.0L Turbo • PDK • 2 chỗ",       price: 3900000000, stock: 1, img: "../images/porsche-boxster.jpg" },
      { id: 21, name: "Lamborghini Huracán EVO",  cat: "Hypercar",    brand: "Lamborghini", meta: "HYPERCAR • 5.2L V10 • 640 HP • AWD",     price: 19000000000,stock: 1, img: "../images/lamborghini-huracan.jpg" },
      { id: 22, name: "Ferrari 296 GTB",          cat: "Hypercar",    brand: "Ferrari",  meta: "HYPERCAR • 3.0L V6 Hybrid • 830 HP",        price: 21500000000,stock: 1, img: "../images/ferrari-296.jpg" },
      { id: 23, name: "Toyota Camry 2.5Q",        cat: "Sedan",       brand: "Toyota",   meta: "SEDAN • 2.5L Xăng • 8AT • 5 chỗ",           price: 1220000000, stock: 6, img: "../images/toyota-camry.jpg" },
      { id: 24, name: "Mercedes-Benz C300 AMG",   cat: "Sedan",       brand: "Mercedes", meta: "SEDAN • 2.0L Turbo • 9G-Tronic • 5 chỗ",    price: 2099000000, stock: 3, img: "../images/mercedes-c300.jpg" }
    ];

    const PER_PAGE = 9;
    const CATEGORIES = ["Tất cả phân loại", "Moto", "Xe máy điện", "Pickup", "SUV", "Phụ kiện", "Roadster", "Hypercar", "Sedan"];
    const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2b4d"/><stop offset="1" stop-color="#0d1a33"/></linearGradient></defs><rect width="400" height="240" fill="url(#g)"/><text x="200" y="130" font-family="Arial" font-size="22" fill="#c9a227" text-anchor="middle">LUXURY AUTO</text></svg>'
    );

    let state = { cat: "Tất cả phân loại", page: 1, list: [...PRODUCTS] };
    let cart = JSON.parse(localStorage.getItem("cart") || "[]");

    const $ = id => document.getElementById(id);
    const fmt = n => n.toLocaleString("vi-VN") + " đ";

    /* ===== KHỞI TẠO ===== */
    function init() {
      // Danh mục
      $("categories").innerHTML = CATEGORIES.map(c =>
        `<li class="${c === state.cat ? 'active' : ''}" data-cat="${c}">${c}</li>`).join("");
      $("categories").addEventListener("click", e => {
        const li = e.target.closest("li"); if (!li) return;
        state.cat = li.dataset.cat;
        document.querySelectorAll("#categories li").forEach(x => x.classList.toggle("active", x === li));
        applyFilter();
      });

      // Hãng xe
      const brands = [...new Set(PRODUCTS.map(p => p.brand))].sort();
      $("brand").innerHTML = `<option value="all">Hãng xe: Tất cả</option>` +
        brands.map(b => `<option value="${b}">${b}</option>`).join("");

      // Sự kiện
      $("applyBtn").onclick = applyFilter;
      $("searchBtn").onclick = applyFilter;
      $("keyword").addEventListener("keydown", e => { if (e.key === "Enter") applyFilter(); });
      ["sort", "brand", "price"].forEach(id => $(id).addEventListener("change", applyFilter));
      $("clearBtn1").onclick = $("clearBtn2").onclick = clearFilter;

      // Dropdown user
      $("userBtn").onclick = e => { e.stopPropagation(); $("user").classList.toggle("open"); };
      document.addEventListener("click", e => { if (!$("user").contains(e.target)) $("user").classList.remove("open"); });

      updateCartCount();
      applyFilter();
    }

    /* ===== LỌC / SẮP XẾP ===== */
    function applyFilter() {
      const kw = $("keyword").value.trim().toLowerCase();
      const brand = $("brand").value;
      const price = $("price").value;
      const sort = $("sort").value;

      let list = PRODUCTS.filter(p => {
        if (state.cat !== "Tất cả phân loại" && p.cat !== state.cat) return false;
        if (kw && !p.name.toLowerCase().includes(kw)) return false;
        if (brand !== "all" && p.brand !== brand) return false;
        if (price !== "all") {
          const [min, max] = price.split("-").map(Number);
          if (p.price < min || p.price > max) return false;
        }
        return true;
      });

      if (sort === "asc") list.sort((a, b) => a.price - b.price);
      else if (sort === "desc") list.sort((a, b) => b.price - a.price);
      else if (sort === "name") list.sort((a, b) => a.name.localeCompare(b.name, "vi"));
      else list.sort((a, b) => b.id - a.id);

      state.list = list;
      state.page = 1;
      render();
    }

    function clearFilter() {
      $("keyword").value = "";
      $("brand").value = "all";
      $("price").value = "all";
      $("sort").value = "new";
      state.cat = "Tất cả phân loại";
      document.querySelectorAll("#categories li").forEach(li => li.classList.toggle("active", li.dataset.cat === state.cat));
      applyFilter();
    }

    /* ===== HIỂN THỊ ===== */
    function render() {
      const total = state.list.length;
      const pages = Math.max(1, Math.ceil(total / PER_PAGE));
      const start = (state.page - 1) * PER_PAGE;
      const items = state.list.slice(start, start + PER_PAGE);

      $("resultText").textContent = total
        ? `Hiển thị ${start + 1} - ${start + items.length} trong số ${total} sản phẩm`
        : "Không có sản phẩm nào";

      $("grid").innerHTML = items.length ? items.map(p => `
        <article class="card">
          <img src="${p.img}" alt="${p.name}" onerror="this.onerror=null;this.src='${PLACEHOLDER}'">
          <div class="card-body">
            <h4>${p.name}</h4>
            <p class="meta">${p.meta}</p>
            <div class="price-row">
              <span class="price">${fmt(p.price)}</span>
              <span class="stock ${p.stock ? '' : 'out'}">${p.stock ? 'Còn hàng: ' + p.stock : 'Hết hàng'}</span>
            </div>
            <div class="btns">
              <button class="btn-detail" onclick="location.href='product-detail.html?id=${p.id}'">Xem chi tiết</button>
              <button class="btn-cart" ${p.stock ? '' : 'disabled'} onclick="addToCart(${p.id})">Thêm vào giỏ <i class="fa-solid fa-cart-shopping"></i></button>
            </div>
          </div>
        </article>`).join("")
        : `<div class="empty"><i class="fa-regular fa-face-frown fa-2x"></i><p style="margin-top:10px">Không tìm thấy phương tiện phù hợp.</p></div>`;

      renderPagination(pages);
    }

    function renderPagination(pages) {
      if (pages <= 1) { $("pagination").innerHTML = ""; return; }
      let html = `<button ${state.page === 1 ? "disabled" : ""} onclick="goPage(${state.page - 1})"><i class="fa-solid fa-chevron-left"></i></button>`;
      for (let i = 1; i <= pages; i++) {
        html += `<button class="${i === state.page ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
      }
      html += `<button ${state.page === pages ? "disabled" : ""} onclick="goPage(${state.page + 1})"><i class="fa-solid fa-chevron-right"></i></button>`;
      $("pagination").innerHTML = html;
    }

    function goPage(n) {
      state.page = n;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    /* ===== GIỎ HÀNG ===== */
    function addToCart(id) {
      const p = PRODUCTS.find(x => x.id === id);
      const item = cart.find(x => x.id === id);
      if (item) item.qty++; else cart.push({ id, qty: 1 });
      localStorage.setItem("cart", JSON.stringify(cart));
      updateCartCount();
      showToast(`Đã thêm "${p.name}" vào giỏ hàng`);
    }
    function updateCartCount() {
      $("cartCount").textContent = cart.reduce((s, x) => s + x.qty, 0);
    }
    function showToast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => t.classList.remove("show"), 2200);
    }

    init();
  </script>
</body>
</html>
